<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-label="footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c5364"/>
      <stop offset="1" stop-color="#0f2027"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="100" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="100" fill="url(#bg)"/>
    <path d="M0 55 Q 150 20 300 55 T 600 55 T 900 55 T 1200 55 V100 H0 Z" fill="#ffffff" opacity="0.06">
      <animateTransform attributeName="transform" type="translate" values="0 0; -300 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <text x="600" y="58" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" fill="#cfe9f7">Thanks for visiting  :)</text>
  </g>
</svg>
